plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        eggify {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include(implementation("me.lucko:fabric-permissions-api:0.7.0"))
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    clientCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    if (!project.hasProperty('withoutCloth')) {
        clientRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: "net.fabricmc.fabric-api"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "eggify-test"
        enableGameTests = true
        enableClientGameTests = project.hasProperty('clientTests')
    }
}

if (project.hasProperty('clientTests')) {
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.runtimeClasspath
    tasks.named('runClientGameTest', JavaExec) {
        jvmArgs "-Deggify.test.expectCloth=${!project.hasProperty('withoutCloth')}"
    }
}

tasks.named('processGametestResources') {
    inputs.property('clientTests', project.hasProperty('clientTests'))
    if (project.hasProperty('clientTests')) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints['fabric-client-gametest'] = ['net.eggify.ConfigNoticeClientTest']
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}

loom.runs.named('gameTest') {
    runDir "build/run/gameTest-${project.minecraft_version}"
}

tasks.register('sourceZip', Zip) {
    archiveFileName = "${project.archives_base_name}-${project.version}-snapshot-7-github-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('.') {
        include '.gitattributes', '.gitignore', 'build.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat'
        include 'LICENSE', 'README.md', 'settings.gradle', 'CHANGELOG.md', 'VALIDATION-2.1.0.md'
        include 'COMPATIBILITY-MOONRISE.md', 'src/**', 'gradle/**', '.github/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
